<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONDAY idle rig</title>
<style>
  :root{--bg:#2a2e38}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,sans-serif;color:#ddd}
  .monday{position:relative;width:min(80vw,512px);aspect-ratio:1}
  .monday img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* body, face and tie breathe together, anchored on the floor line (y≈73.8%) */
  .monday .breath{position:absolute;inset:0;transform-origin:50% 73.8%;animation:breath 3.2s ease-in-out infinite}
  .monday .tie{transform-origin:50% 58.2%;animation:sway 3.2s ease-in-out infinite}
  .monday .eyes-half,.monday .eyes-closed{opacity:0}
  .monday .eyes-half{animation:half 5.3s steps(1) infinite}
  .monday .eyes-closed{animation:closed 5.3s steps(1) infinite}
  @keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(.988,1.018)}}
  @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(.7deg)}}
  @keyframes half{0%,86%{opacity:0}87%,88%{opacity:1}89%,93%{opacity:0}94%,95%{opacity:1}96%,100%{opacity:0}}
  @keyframes closed{0%,88%{opacity:0}89%,93%{opacity:1}94%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.monday *{animation:none!important}}
</style></head>
<body>
<div class="monday" role="img" aria-label="MONDAY（マンデー）待機姿">
  <img src="parts/01_puddle.png" alt="">
  <div class="breath">
    <img src="parts/02_body.png" alt="">
    <img src="parts/03_eyes_open.png" alt="">
    <img class="eyes-half" src="parts/03_eyes_half.png" alt="">
    <img class="eyes-closed" src="parts/03_eyes_closed.png" alt="">
    <img src="parts/04_mouth.png" alt="">
    <img class="tie" src="parts/05_tie.png" alt="">
  </div>
</div>
</body></html>
